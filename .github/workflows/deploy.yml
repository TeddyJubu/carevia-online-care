# Every push to main (a merge, or a direct push) runs the test job and, only if it passes, deploys to https://carevia.triplelabs.dev and then
# fast-forwards patient-journey to match. The SSH key can only run ~/carevia/bin/receive-deploy on the VPS.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: production
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: carevia
          POSTGRES_PASSWORD: carevia
          POSTGRES_DB: carevia
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://carevia:carevia@127.0.0.1:5432/carevia
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
      DAILY_API_URL: http://127.0.0.1:4090/v1 # the smoke script's fake Daily
      HOLD_LIMIT: 1000 # the smoke makes ~17 holds from one IP; production keeps the default 10
      DEMO_ADMIN_PASSWORD: ci-only-admin-password # throwaway CI database; production's is in ~/carevia/api.env
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci # scripts on, so apps/api's postinstall runs prisma generate
      - run: npm run db:setup
      - run: npm run test:api
      - run: npm run typecheck --prefix apps/web
      # Both modes from the header of apps/api/scripts/smoke.mjs: the demo journey, then the production locks.
      - name: Smoke (demo mode)
        run: |
          DEMO_MODE=true NODE_ENV=development npm run start --prefix apps/api > api-demo.log 2>&1 &
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://127.0.0.1:4000/api/health
          npm run smoke:api
          kill %1
      - name: Smoke (demo mode off)
        run: |
          NODE_ENV=production npm run start --prefix apps/api > api-prod.log 2>&1 &
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://127.0.0.1:4000/api/health
          npm run smoke:api
          kill %1
      - name: API logs
        if: failure()
        run: tail -n 100 api-*.log
  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, so the patient-journey push can be checked as a fast-forward
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: SSH access to the VPS
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host sandbox\n  HostName 103.51.129.99\n  User ubuntu\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n' > ~/.ssh/config
      - run: deploy/vps/deploy.sh
      # Pushes made with GITHUB_TOKEN don't start workflows, so this can't loop.
      - name: Fast-forward patient-journey
        run: git push origin HEAD:patient-journey || echo "::warning::patient-journey has commits main lacks, so it was not updated"
