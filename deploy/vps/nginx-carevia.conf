# Routes for https://carevia.triplelabs.dev. Included from the certbot-managed server block in
# /etc/nginx/sites-available/carevia.triplelabs.dev, so certbot keeps owning TLS and git owns routing.
root /home/ubuntu/telemed-project;
index index.html;
server_tokens off;

# Compression. Ubuntu's nginx.conf turns gzip on but only for text/html.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

# API: keeps the /api prefix. TRUST_PROXY=true in api.env makes the rate limiter use X-Forwarded-For.
location /api/ {
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
}

# Vite's hashed bundles never change under the same name: cache for a year. ^~ skips the regex rules below.
location ^~ /app/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location ^~ /admin/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Single-page apps: unknown paths fall back to each app's index.html, which must never be cached
# (it names the current hashed bundles).
location /app/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /app/index.html;
}
location /admin/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /admin/index.html;
}

location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
}

# Backstop: nginx's mime.types maps .mjs to octet-stream, which browsers refuse as a module.
# types{} replaces the inherited map, so it is scoped to .mjs only. build.mjs already refuses to ship .mjs.
location ~* \.mjs$ {
    types { application/javascript mjs; }
    expires 7d;
}

# Homepage assets (not hashed): a week.
location ~* \.(?:css|js|woff2|jpg|jpeg|png|webp|avif|mp4|webm|svg)$ {
    expires 7d;
    add_header Cache-Control "public";
}
