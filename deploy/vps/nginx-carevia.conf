# Routes for https://carevia.claudemod.tech. Included from the certbot-managed server block in
# /etc/nginx/sites-available/carevia.claudemod.tech, so certbot keeps owning TLS and git owns routing.
root /home/ubuntu/telemed-project;
index index.html;

# API: keeps the /api prefix. TRUST_PROXY=true in api.env makes the rate limiter use X-Forwarded-For.
location /api/ {
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
}

# Single-page apps: unknown paths fall back to each app's index.html.
location /app/ {
    try_files $uri $uri/ /app/index.html;
}
location /admin/ {
    try_files $uri $uri/ /admin/index.html;
}

location / {
    try_files $uri $uri/ =404;
}

# Hashed or rarely changing assets.
location ~* \.(?:css|js|woff2|jpg|jpeg|png|webp|avif|mp4|webm|svg)$ {
    expires 7d;
    add_header Cache-Control "public";
}
